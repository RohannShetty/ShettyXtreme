# Default watchlist — internal symbols only (broker-neutral).
#
# `security_id` holds the *internal* symbol (previously Dhan numeric security
# IDs like "13"/"25"). The Fyers symbol resolver (integration/fyers/symbols.py)
# converts internal symbols to Fyers tickers at runtime:
#   NIFTY     -> NSE:NIFTY50-INDEX
#   BANKNIFTY -> NSE:NIFTYBANK-INDEX
#   FINNIFTY  -> NSE:FINNIFTY-INDEX
default_watchlist:
  indices:
    - name: NIFTY
      security_id: NIFTY      # internal symbol (was Dhan "13")
      exchange: NSE_FNO
    - name: BANKNIFTY
      security_id: BANKNIFTY  # internal symbol (was Dhan "25")
      exchange: NSE_FNO
    - name: FINNIFTY
      security_id: FINNIFTY   # internal symbol (was Dhan "27")
      exchange: NSE_FNO
  options:
    - name: NIFTY ATM CE
      exchange: NSE_FNO
      auto_discover: true  # Auto-discover current-week ATM strike
    - name: NIFTY ATM PE
      exchange: NSE_FNO
      auto_discover: true
    - name: BANKNIFTY ATM CE
      exchange: NSE_FNO
      auto_discover: true
    - name: BANKNIFTY ATM PE
      exchange: NSE_FNO
      auto_discover: true
