[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shettyxtreme"
version = "0.13.0"
description = "Unified Indian-market trading intelligence and execution platform"
requires-python = ">=3.11"
authors = [{name = "Rohan Shetty", email = "shettyrohan2@gmail.com"}]

dependencies = [
    "duckdb>=1.5.4",
    # Fyers broker SDK (F4/F6): HSM market-data socket only. Install with
    # --no-deps: the SDK's pinned deps shadow stdlib (asyncio==3.4.3) — never
    # install them. The SDK's fyers_logger hard-requires aws-lambda-powertools
    # at import time, so it is declared explicitly here (safe: no stdlib
    # shadowing). REST/order layers are raw httpx+websockets.
    "fyers-apiv3>=3.1.15",
    "aws-lambda-powertools>=2.0.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "rich>=13",
    "structlog>=23",
    "textual>=0.41",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
    "ruff>=0.1",
    "pre-commit>=3",
]
openalgo = ["openalgo>=1.0.0"]
quantlib = ["QuantLib>=1.43"]
ui = ["pyqt6>=6.5", "pyqtgraph>=0.13", "textual>=0.41"]
iaf = ["investing-algorithm-framework>=8.0,<9.0"]
research = ["jupyter", "matplotlib>=3.7", "seaborn>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shettyxtreme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
